name: 'Execute tests'

on:
  workflow_call:
    inputs:
      ref:
        description: Exact tag or commit to validate before publishing
        required: false
        type: string
        default: ''
  workflow_dispatch:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

permissions:
  contents: read

concurrency:
  group: tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:

  tests:
    name: Run local unit tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.ref || github.ref }}
      - name: set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: '21'
      - name: Local unit tests with Gradle
        run: ./gradlew testFDroidDebugUnitTest lintFDroidDebug
        env:
          JAVA_TOOL_OPTIONS: "-Djava.net.preferIPv4Stack=true"
      - name: Upload tests results
        uses: actions/upload-artifact@v5
        if: success() || failure()
        with:
          name: test-results
          path: ./**/testFDroidDebugUnitTest/TEST-*.xml

  detector-tests:
    name: Run image and OCR tests on Android
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.ref || github.ref }}
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: '21'
      - name: Run detector instrumentation tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 31
          arch: x86_64
          target: google_apis
          profile: pixel_6
          disable-animations: true
          script: ./gradlew :core:smart:detection:connectedFDroidDebugAndroidTest
      - name: Upload detector test results
        uses: actions/upload-artifact@v5
        if: success() || failure()
        with:
          name: detector-test-results
          path: core/smart/detection/build/outputs/androidTest-results/connected/
