name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag to publish, for example v4.0.5.6
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    name: Verify release source
    uses: ./.github/workflows/execute-tests.yml
    with:
      ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}

  build:
    needs: verify
    name: Build application
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v5
      with:
        ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}

    - name: set up JDK 21
      uses: actions/setup-java@v5
      with:
        distribution: 'zulu'
        java-version: '21'

    - name: set NDK
      shell: bash
      run: |
        set -x
        echo "ANDROID_NDK=$ANDROID_NDK_LATEST_HOME" >> $GITHUB_ENV
        echo "ANDROID_NDK_HOME=$ANDROID_NDK_LATEST_HOME" >> $GITHUB_ENV
        echo "ANDROID_NDK_ROOT=$ANDROID_NDK_LATEST_HOME" >> $GITHUB_ENV

    - name: Restore keystore
      env:
        RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
      run: |
        test -n "$RELEASE_KEYSTORE_BASE64" || { echo "RELEASE_KEYSTORE_BASE64 is missing"; exit 1; }
        printf '%s' "$RELEASE_KEYSTORE_BASE64" | base64 --decode > smartautoclicker/smartautoclicker.jks

    - name: Build with Gradle
      run: ./gradlew --info assembleFDroidRelease
      env:
        JAVA_TOOL_OPTIONS: "-Djava.net.preferIPv4Stack=true"
        ORG_GRADLE_PROJECT_signingStorePassword: ${{ secrets.SIGNING_STORE_PASSWORD }}
        ORG_GRADLE_PROJECT_signingKeyAlias: ${{ secrets.SIGNING_KEY_ALIAS }}
        ORG_GRADLE_PROJECT_signingKeyPassword: ${{ secrets.SIGNING_KEY_PASSWORD }}

    - name: Prepare versioned release assets
      shell: bash
      run: |
        set -euo pipefail
        tag="${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}"
        version="${tag#v}"
        mkdir -p release-assets
        for apk in smartautoclicker/build/outputs/apk/fDroid/release/*.apk; do
          abi="${apk##*-fDroid-}"
          abi="${abi%-release.apk}"
          cp "$apk" "release-assets/Klickr-${version}-${abi}-release.apk"
        done
        (cd release-assets && sha256sum *.apk > SHA256SUMS.txt)

    - name: Publish GitHub release
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
        RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
      run: |
        set -euo pipefail

        if ! gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
          gh release create "$RELEASE_TAG" \
            --title "Klick'r $RELEASE_TAG" \
            --draft \
            --generate-notes \
            --verify-tag
        fi

        for asset in release-assets/*; do
          asset_name="$(basename "$asset")"
          local_digest="sha256:$(sha256sum "$asset" | cut -d ' ' -f 1)"
          remote_digest="$(
            gh release view "$RELEASE_TAG" --json assets \
              --jq ".assets[] | select(.name == \"$asset_name\") | .digest" \
              | head -n 1
          )"

          if [[ -n "$remote_digest" && "$remote_digest" == "$local_digest" ]]; then
            echo "Asset already uploaded and verified: $asset_name"
            continue
          fi

          uploaded=false
          for attempt in 1 2 3 4 5; do
            if gh release upload "$RELEASE_TAG" "$asset" --clobber; then
              uploaded=true
              break
            fi

            if [[ "$attempt" -lt 5 ]]; then
              delay=$((attempt * 15))
              echo "Upload failed for $asset_name; retrying in ${delay}s (attempt $attempt/5)"
              sleep "$delay"
            fi
          done

          [[ "$uploaded" == true ]] || {
            echo "Failed to upload $asset_name after 5 attempts"
            exit 1
          }
        done

        expected_count="$(find release-assets -maxdepth 1 -type f | wc -l | tr -d ' ')"
        uploaded_count="$(gh release view "$RELEASE_TAG" --json assets --jq '.assets | length')"
        [[ "$uploaded_count" -eq "$expected_count" ]] || {
          echo "Release asset count mismatch: expected $expected_count, found $uploaded_count"
          exit 1
        }

        gh release edit "$RELEASE_TAG" \
          --title "Klick'r $RELEASE_TAG" \
          --draft=false \
          --prerelease=false
