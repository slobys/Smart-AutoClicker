name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag to publish, for example v4.0.5.6
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build application
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
      with:
        ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}

    - name: set up JDK 21
      uses: actions/setup-java@v4
      with:
        distribution: 'zulu'
        java-version: '21'

    - name: set NDK
      shell: bash
      run: |
        set -x
        echo "ANDROID_NDK=$ANDROID_NDK_LATEST_HOME" >> $GITHUB_ENV
        echo "ANDROID_NDK_HOME=$ANDROID_NDK_LATEST_HOME" >> $GITHUB_ENV
        echo "ANDROID_NDK_ROOT=$ANDROID_NDK_LATEST_HOME" >> $GITHUB_ENV

    - name: Restore keystore
      env:
        RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
      run: |
        test -n "$RELEASE_KEYSTORE_BASE64" || { echo "RELEASE_KEYSTORE_BASE64 is missing"; exit 1; }
        printf '%s' "$RELEASE_KEYSTORE_BASE64" | base64 --decode > smartautoclicker/smartautoclicker.jks

    - name: Build with Gradle
      run: ./gradlew --info assembleFDroidRelease
      env:
        JAVA_TOOL_OPTIONS: "-Djava.net.preferIPv4Stack=true"
        ORG_GRADLE_PROJECT_signingStorePassword: ${{ secrets.SIGNING_STORE_PASSWORD }}
        ORG_GRADLE_PROJECT_signingKeyAlias: ${{ secrets.SIGNING_KEY_ALIAS }}
        ORG_GRADLE_PROJECT_signingKeyPassword: ${{ secrets.SIGNING_KEY_PASSWORD }}

    - name: Prepare versioned release assets
      shell: bash
      run: |
        set -euo pipefail
        tag="${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}"
        version="${tag#v}"
        mkdir -p release-assets
        for apk in smartautoclicker/build/outputs/apk/fDroid/release/*.apk; do
          abi="${apk##*-fDroid-}"
          abi="${abi%-release.apk}"
          cp "$apk" "release-assets/Klickr-${version}-${abi}-release.apk"
        done
        (cd release-assets && sha256sum *.apk > SHA256SUMS.txt)

    - name: Publish GitHub release
      uses: softprops/action-gh-release@v2
      with:
        tag_name: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
        name: Klick'r ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
        draft: false
        prerelease: false
        generate_release_notes: true
        files: release-assets/*
